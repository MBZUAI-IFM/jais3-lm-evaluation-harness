dataset_path: IFM/IslamicEval2025-Subtask1B_verified
dataset_name: default
task: islamic_qa_IslamicEval2015_1B
test_split: test

output_type: multiple_choice

doc_to_text: |
  Classify the following text into one of these four categories:

  - CorrectAyah: exact Qur'an verse, written correctly  
  - WrongAyah: Qur'an verse but incorrect/incomplete  
  - CorrectHadith: authentic Hadith, written correctly  
  - WrongHadith: Hadith but incorrect/incomplete  

  Text: "{{ full_span }}"

  Output only one category name.
  The chosen category is: 
doc_to_choice: !function utils.doc_to_choice
doc_to_target: !function utils.doc_to_target

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
