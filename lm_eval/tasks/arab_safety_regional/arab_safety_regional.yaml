task: arab_safety_regional
dataset_path: json
dataset_kwargs:
  data_files:
    test: ./arab_safety_regional_data/Regional_data_original.jsonl
test_split: test
process_docs: !function utils.process_docs
output_type: generate_until
description: "أنت مساعد مفيد للإجابة على الأسئلة العربية"
doc_to_text: "{{question}}"
doc_to_target: ""
metric_list:
  - metric: !function utils.response_length_metric
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - <end_of_turn>
    - <eos>
    - </s>
    - <|end_of_text|>
    - <|eot_id|>
    - <|endoftext|>
    - <|im_end|>
  do_sample: false
metadata:
  version: 1.0
