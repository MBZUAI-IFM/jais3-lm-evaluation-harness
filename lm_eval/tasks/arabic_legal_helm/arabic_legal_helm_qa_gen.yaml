task: arabic_legal_helm_qa_gen
tag:
  - arabic_legal_helm_tasks
dataset_path: IFM/arabic-enterprise_verified
dataset_name: legal
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_qa
doc_to_text: "{{input}}"
doc_to_target: "{{answer}}"
metric_list:
  - metric: !function utils.placeholder_metric
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - <end_of_turn>
    - <|im_end|>
    - <eos>
    - </s>
    - <|end_of_text|>
    - <|eot_id|>
    - <|endoftext|>
  do_sample: false
metadata:
  version: 0.0
