task: arabic_finance_helm_bool
tag:
  - arabic_finance_helm_tasks
dataset_path: IFM/arabic-enterprise_verified
dataset_name: finance
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_bool
doc_to_text: "{{query}}"
doc_to_target: "{{bool_answer_ar}}"
generation_kwargs:
  until:
    - <end_of_turn>
    - <|im_end|>
    - <eos>
    - </s>
  do_sample: false
  temperature: 0.0
  max_gen_toks: 10
filter_list:
  - name: extract-bool
    filter:
      - function: regex
        regex_pattern: "(نعم|لا)"
        group_select: 0
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: false
    ignore_punctuation: false
metadata:
  version: 1.0
