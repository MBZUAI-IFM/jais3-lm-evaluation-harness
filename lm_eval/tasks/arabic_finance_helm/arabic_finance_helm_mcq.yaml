task: arabic_finance_helm_mcq
tag:
  - arabic_finance_helm_tasks
dataset_path: stanford-crfm/arabic-enterprise
dataset_name: finance
dataset_kwargs:
  revision: 35e114eda2e3450e0e69cf6bda9d3a2f54bf6f26
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_mcq
doc_to_text: "{{query}}"
doc_to_target: "{{gold_letter_ar}}"
generation_kwargs:
  until:
    - <end_of_turn>
    - <|im_end|>
    - <eos>
    - </s>
  do_sample: false
  temperature: 0.0
filter_list:
  - name: extract-letter
    filter:
      - function: regex
        regex_pattern: "([أبج]|(?<![A-Za-z])[ABC](?![A-Za-z]))"
        group_select: 0
      - function: take_first
      - function: map
        mapping_dict: {"A": "أ", "B": "ب", "C": "ج", "أ": "أ", "ب": "ب", "ج": "ج"}
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: false
    ignore_punctuation: false
metadata:
  version: 1.0
