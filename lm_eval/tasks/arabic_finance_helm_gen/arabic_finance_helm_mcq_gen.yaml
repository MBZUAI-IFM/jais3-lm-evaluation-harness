task: arabic_finance_helm_mcq_gen
tag:
  - arabic_finance_helm_gen_tasks
dataset_path: IFM/arabic-enterprise_verified
dataset_name: finance
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_mcq_gen
doc_to_text: "{{query}}"
doc_to_target: "{{gold_letter_ar}}"
generation_kwargs:
  until:
    - <end_of_turn>
    - <|im_end|>
    - <eos>
    - </s>
    - <|end_of_text|>
    - <|eot_id|>
    - <|endoftext|>
  do_sample: false
metric_list:
  - metric: !function utils.placeholder_metric
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0.0
