task: abb
# Arabic Broad Benchmark (ABB, SILMA.AI) — 470 human-validated Arabic questions across 22
# skills sampled from 64 datasets. This task ONLY GENERATES the model's answer to each
# instruction (single user turn, greedy, faithful to the official abb_eval.py). The real ABB
# score is produced by the standalone scorer hasan.iqbal/abb_eval/abb_score.py, which
# reproduces the official evaluate_and_score verbatim: per-question `scoring_rules` (an
# equal-weighted mix of manual rules — ROUGE/METEOR/Levenshtein/words-intersection/JSON/IFEval/
# diacritization/… — and LLM-as-judge variations) averaged 0-10, per category. The official
# judge is GPT-4.1; we use gemma-4-26B-A4B-it on-cluster. NOT wired into judge_vllm /
# BENCHMARK_TO_JUDGE — scoring is a separate step on the generated samples. Gated dataset
# (silma-ai/arabic-broad-benchmark), staged under LOCAL_BENCHMARK_PATH/arabic_broad_benchmark/.
# ABSOLUTE path (cwd-independent). NB: the data dir must NOT be named "abb" — lm-eval's CLI
# treats a `--tasks abb` arg as a directory-of-yamls if an "abb" dir exists in the run's cwd
# (LOCAL_BENCHMARK_PATH), which would silently select zero tasks.
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: ./arabic_broad_benchmark/abb.jsonl
test_split: test
output_type: generate_until
doc_to_text: "{{instruction}}"
doc_to_target: "{{output}}"
metric_list:
  - metric: !function utils.abb_generated_baseline
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - <end_of_turn>
    - <eos>
    - </s>
    - <|end_of_text|>
    - <|eot_id|>
    - <|endoftext|>
    - <|im_end|>
  do_sample: false
metadata:
  version: 1.0