# Arabic IFEval (inception42/Arabic-IFEval, formerly inceptionai/Arabic_IFEval) — 404 Arabic instruction-following prompts,
# verifiable/programmatic (NO LLM judge). 23 instruction types; scored by
# utils.process_results via the Arabic instruction registry. Read from the Hugging Face repo, pinned
# to the commit verified byte-identical to the former local copy.
task: ifeval_ar
dataset_path: inception42/Arabic-IFEval
dataset_name: null
dataset_kwargs:
  revision: 48f209003f5c90055248d11b8f0e4ffd4162cb87
  data_files:
    test: ar_IFEval.jsonl
output_type: generate_until
test_split: test
num_fewshot: 0
doc_to_text: "{{prompt}}"
doc_to_target: 0
generation_kwargs:
  until:
    - <end_of_turn>
    - <eos>
    - </s>
    - <|end_of_text|>
    - <|eot_id|>
    - <|endoftext|>
    - <|im_end|>
  do_sample: false
  temperature: 0.0
  max_gen_toks: 1280
process_results: !function utils.process_results
metric_list:
  - metric: prompt_level_strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_strict_acc
    aggregation: !function utils.agg_inst_level_acc
    higher_is_better: true
  - metric: prompt_level_loose_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_loose_acc
    aggregation: !function utils.agg_inst_level_acc
    higher_is_better: true
metadata:
  version: 1.0
