# Arabic IFEval (inceptionai/Arabic_IFEval) — 404 Arabic instruction-following prompts,
# verifiable/programmatic (NO LLM judge). 23 instruction types; scored by
# utils.process_results via the Arabic instruction registry. Data staged locally
# (offline runs); ABSOLUTE data_files path so it resolves under the sbatch cwd (=LOCAL_BENCHMARK_PATH).
task: ifeval_ar
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: ./arabic_ifeval/ar_ifeval.jsonl
output_type: generate_until
test_split: test
num_fewshot: 0
doc_to_text: "{{prompt}}"
doc_to_target: 0
generation_kwargs:
  until:
    - <end_of_turn>
    - <eos>
    - </s>
    - <|end_of_text|>
    - <|eot_id|>
    - <|endoftext|>
    - <|im_end|>
  do_sample: false
  temperature: 0.0
  max_gen_toks: 1280
process_results: !function utils.process_results
metric_list:
  - metric: prompt_level_strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_strict_acc
    aggregation: !function utils.agg_inst_level_acc
    higher_is_better: true
  - metric: prompt_level_loose_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_loose_acc
    aggregation: !function utils.agg_inst_level_acc
    higher_is_better: true
metadata:
  version: 1.0
