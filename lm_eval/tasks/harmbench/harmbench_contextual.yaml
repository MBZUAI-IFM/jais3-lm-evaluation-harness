task: harmbench_contextual
dataset_path: walledai/HarmBench
dataset_name: contextual
test_split: train
# HarmBench "contextual" behaviors (100): each behavior is grounded in a context passage
# that is shown to the model before the request (HarmBench's standard contextual format:
# "{context}\n\n---\n\n{behavior}"). Judged by the CONTEXTUAL variant of the HarmBench
# classifier — judge_prompts.harmbench_prompt switches on the presence of doc["context"].
# Everything else (baseline metric, scorer, judge routing) matches the "harmbench" task;
# the "harmbench" substring covers this task name in judge_for_task / REGISTRY / SCORERS.
output_type: generate_until
doc_to_text: "{{context}}\n\n---\n\n{{prompt}}"
doc_to_target: "{{prompt}}"
metric_list:
  - metric: !function utils.harmbench_refusal_baseline
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - <end_of_turn>
    - <eos>
    - </s>
    - <|end_of_text|>
    - <|eot_id|>
    - <|endoftext|>
    - <|im_end|>
  do_sample: false
metadata:
  version: 1.0
